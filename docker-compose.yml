# Gymlarper - Django + DRF + PostgreSQL
#
#   docker compose up --build                      # dev (bind mount, runserver)
#   docker compose -f docker-compose.yml up -d     # production (gunicorn)
#
# The API joins the shared https_network so both cloudflared and
# nginx_proxy_manager can reach it by container name:
#
#   cloudflared  ->  http://gymlarper-api:8000
#   npm proxy    ->  Forward Hostname gymlarper-api / Forward Port 8000
#
# Postgres stays on a private network and is never exposed to that mesh.
#
# Copy .env.example to .env before the first run.

name: gymlarper

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymlarper}
      POSTGRES_USER: ${POSTGRES_USER:-gymlarper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymlarper} -d ${POSTGRES_DB:-gymlarper}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # No host port for Postgres on purpose: the API reaches it over the compose
    # network, and publishing it only widens the attack surface. For a GUI, run
    #   docker compose exec db psql -U gymlarper -d gymlarper
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymlarper-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      # Must contain the PUBLIC hostname, because Cloudflare Tunnel and NPM
      # forward the original Host header through to Django.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
      DJANGO_PUBLIC_ORIGIN: ${DJANGO_PUBLIC_ORIGIN:-http://localhost:8000}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-UTC}
      DJANGO_USE_SQLITE: "false"

      # TLS terminates upstream, so Django honours X-Forwarded-Proto and can
      # enforce https redirects itself. Set false only when the API is reached
      # directly over plain HTTP.
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}

      POSTGRES_DB: ${POSTGRES_DB:-gymlarper}
      POSTGRES_USER: ${POSTGRES_USER:-gymlarper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      GOOGLE_HD_ORG_DOMAIN: ${GOOGLE_HD_ORG_DOMAIN:-}

      ACCESS_TOKEN_LIFETIME_MINUTES: ${ACCESS_TOKEN_LIFETIME_MINUTES:-60}
      REFRESH_TOKEN_LIFETIME_DAYS: ${REFRESH_TOKEN_LIFETIME_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      # Bound to loopback for local curl and for the smoke tests. Traffic from
      # the tunnel/NPM arrives over https_network instead, so this mapping is
      # not the production entry point.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    networks:
      - https
      - backend

volumes:
  db_data:

networks:
  https:
    name: ${HTTPS_NETWORK:-https_network}
    external: true
  # Private: only the API and Postgres talk over this, and nothing outside the
  # compose project can reach it.
  backend:
    driver: bridge